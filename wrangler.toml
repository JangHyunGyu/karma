name = "karma-api"
main = "assets/js/worker.js"
no_bundle = true
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "archerlab_db"
database_id = "babeec1b-1079-4a44-aefe-e1ffaa01f7ff"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "archerlab-r2"

[[kv_namespaces]]
binding = "KARMA_SHARE"
id = "36de9b5fcee54d40964bcc124d8a4ad4"

[[services]]
binding = "OPENROUTER_MEDIA"
service = "openrouter-api"
entrypoint = "OpenRouterMediaEntrypoint"

[[services]]
binding = "DEEPSEEK_TEXT"
service = "openrouter-api"
entrypoint = "DeepSeekTextEntrypoint"

[vars]
CORS_ORIGIN = "*"
R2_PUBLIC_URL = "https://pub-54cf8dbbbe6645cd9d493700dcedb706.r2.dev"
